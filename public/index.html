<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Saccadence Stimulus</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
  canvas { display: block; }
  /* stage stays clean for the jury — all status only in the console */

  #start-screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #0b0b0d; color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #start-screen .panel {
    width: 360px; padding: 32px; border-radius: 12px;
    background: #16161a; border: 1px solid #2a2a30;
  }
  #start-screen h1 { font-size: 18px; margin: 0 0 4px; }
  #start-screen .sub { font-size: 12px; color: #888; margin: 0 0 20px; }
  #start-screen label { display: block; font-size: 12px; color: #aaa; margin: 14px 0 4px; }
  #start-screen input, #start-screen select {
    width: 100%; box-sizing: border-box; padding: 8px 10px;
    background: #0e0e11; border: 1px solid #333; border-radius: 6px;
    color: #e8e8e8; font-size: 13px;
  }
  #start-screen button {
    width: 100%; margin-top: 22px; padding: 10px; border: none; border-radius: 6px;
    background: #3a7bfd; color: #fff; font-size: 14px; cursor: pointer;
  }
  #start-error { color: #ff6b6b; font-size: 12px; min-height: 16px; margin-top: 8px; }
  #session-code-row {
    margin-top: 18px; padding-top: 14px; border-top: 1px solid #2a2a30;
    font-size: 12px; color: #888;
  }
  #session-code { font-size: 16px; letter-spacing: 3px; color: #e8e8e8; font-weight: 600; }
  #pair-status { margin-top: 6px; font-size: 12px; color: #888; }
  #session-qr { margin-top: 12px; width: 132px; background: #fff; padding: 8px; border-radius: 6px; }
  #session-qr svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="start-screen">
  <div class="panel">
    <h1>Saccadence — Clinic Rig</h1>
    <p class="sub">Enter credentials to begin a session</p>
    <form id="start-form">
      <label>Username</label>
      <input name="username" type="text" autocomplete="off" value="clinician">

      <label>PIN</label>
      <input name="pin" type="password" inputmode="numeric" autocomplete="off">

      <label>Screen width (mm)</label>
      <input name="screenWidth" type="number">

      <label>Viewing distance (mm)</label>
      <input name="viewDist" type="number">

      <label>Protocol</label>
      <select name="protocol">
        <option value="full-90s">Full Protocol — saccade + pursuit (~90s)</option>
        <option value="saccade-latency-10step">Saccade Latency only (10-step)</option>
      </select>

      <label>Language</label>
      <select name="language">
        <option value="en">English</option>
        <option value="ta">தமிழ் (Tamil)</option>
      </select>

      <div id="start-error"></div>
      <button type="submit">Enter</button>

      <div id="session-code-row">
        Pair mobile — session code: <span id="session-code">------</span>
        <div id="session-qr"></div>
        <div id="pair-status">Waiting for phone…</div>
      </div>
    </form>
  </div>
</div>
<canvas id="stage"></canvas>
<!-- Classic (non-module) script: puts qrcode() on window ahead of main.js. -->
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
